[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lsf"
version = "1.0.0"
description = "Least Slack First -- terminal assignment scheduler"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "tomli>=1.2; python_version < '3.11'",
    "textual>=0.80",
]

[project.scripts]
lsf = "lsf.scheduler:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lsf*"]

[tool.setuptools.package-data]
lsf = ["py.typed"]
