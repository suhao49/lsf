name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # -- Standalone PyInstaller bundles (no Python needed on the target) --------
  standalone:
    name: standalone (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            build: .\packaging\build-windows.ps1
          - label: macos-arm64
            os: macos-latest
            build: bash packaging/build-posix.sh
          - label: macos-x64
            os: macos-15-intel
            build: bash packaging/build-posix.sh
          # Oldest supported Ubuntu runner: PyInstaller bundles link against
          # the build machine's glibc, so older build = wider compatibility.
          - label: linux-x64
            os: ubuntu-22.04
            build: bash packaging/build-posix.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + PyInstaller
        run: pip install . pyinstaller

      - name: Build
        run: ${{ matrix.build }}

      - name: Smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            dist/lsf/lsf.exe --help
            dist/lsf/lsf.exe --json
          else
            dist/lsf/lsf --help
            dist/lsf/lsf --json
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lsf-${{ matrix.label }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  # -- Debian/Ubuntu .deb ------------------------------------------------------
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python python3-all python3-setuptools \
            python3-build python3-installer pybuild-plugin-pyproject

      - name: Build .deb
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          mv ../lsf_*.deb dist/

      - name: Smoke test (install and run)
        run: |
          sudo apt-get install -y ./dist/lsf_*.deb
          lsf --help
          lsf --json

      - uses: actions/upload-artifact@v4
        with:
          name: lsf-deb
          path: dist/*.deb
          if-no-files-found: error

  # -- Fedora/RHEL .rpm ----------------------------------------------------------
  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y rpm-build python3-devel python3-setuptools \
            python3-build python3-installer python3-wheel python3-textual

      - name: Build .rpm
        run: |
          rpmbuild -ba lsf.spec --define "_sourcedir $(pwd)"
          mkdir -p dist
          mv ~/rpmbuild/RPMS/noarch/lsf-*.rpm dist/

      - name: Smoke test (install and run)
        run: |
          dnf install -y ./dist/lsf-*.rpm
          lsf --help
          lsf --json

      - uses: actions/upload-artifact@v4
        with:
          name: lsf-rpm
          path: dist/*.rpm
          if-no-files-found: error

  # -- Attach everything to a GitHub release on tag pushes -----------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [standalone, deb, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
          fail_on_unmatched_files: true
